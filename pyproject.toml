[project]
name = "tuilip"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "caetanogenete@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "more-itertools>=11.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources.tuilip]
workspace = true

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.16",
]

[tool.pyright]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = true

exclude = [
	".venv",
	"**/__pycache__",
    "src/tuilip/input/win32.py",
    "src/tuilip/input/posix.py"
]

[tool.ruff.lint]
ignore = ["E741"]
